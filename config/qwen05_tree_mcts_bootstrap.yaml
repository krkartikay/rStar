mode: "mcts"
model_dir: "models/qwen2.5-0.5b-instruct"
few_shot_path: "./rstar_deepthink/few_shots/few_shots.json"
prompt_path: "./rstar_deepthink/few_shots/mcts_prompt.json"
swap_space: 4
temperature: 0.7
top_p: 0.95
