task_type: "coding"
llm_backend: "openai_api"
api_model: "gpt-5.4-nano"
mode: "mcts"
prompt_wrap: "swe"
result_unwrap: "swe"
step_delim: "\n"
stop: ["<end_of_bash>", "<end_of_finish>"]
temperature: 0.7
top_p: 1.0
max_tokens: 2048
n_generate_sample: 2
best_of: 1
iterations: 2
max_depth: 25
errors_threshold: 2
positive_reward: 1.0
negative_reward: -1.0
need_value_func: false
update_leaf_value: false
terminal_sample: true
batch_size: 1
workspace_root: "./workspaces"
keep_workspaces: false
bash_timeout_seconds: 60
bash_output_max_chars: 12000
test_command: ""
